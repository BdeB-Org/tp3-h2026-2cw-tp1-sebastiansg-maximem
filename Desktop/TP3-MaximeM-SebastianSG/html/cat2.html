<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault - Xbox</title>
    <link rel="stylesheet" href="../css/commun.css" />
</head>

<body>
    <!--Header-->
    <header>
        <!--Une div avec deux éléments distincts (img et nav). La div est là pour que le flex fonctionne. Le flex va voir qui'il y a deux éléments-->
        <div class="header-container">
            <a href="../index.html">
                <img src="../images/PixelVault logo 2.1.png" alt="Logo PixelVault" width="150px">
            </a>
            <!--Barre de navigation-->
            <nav class="navigation">
                <div class="rectangle2" style="margin-right: 15px;"><a href="../index.html">Acceuil</a></div>
                <div class="rectangle1"><a href="./collection.html">Collection</a></div>
            </nav>
    </header>

    <!--Produit(s) qu'on peut acheter-->
    <main class="contenu_main">
        <h1 class="h_1">Collection</h1>
        <section>
            <div class="boite1">
                <img src="../images/Logo Xbox.png" alt="Logo Xbox" width="50px">
                <p class="nom_boite1">Xbox</p>
            </div>
            <div class="contenu_boite1">
                <div class="produits">
                    <img style="margin-bottom: 30px;" src="../images/Xbox original.png" alt="Image Xbox original"
                        width="170px">
                    <nav>
                        <a class="btn" href="./prod3.html">Xbox (Original)</a>
                    </nav>
                </div>
                <div class="produits">
                    <img style="margin-bottom: 20px;" src="../images/Xbox 360.png" alt="Image Xbox 360" width="220px">
                    <nav>
                        <a class="btn" href="./prod4.html">Xbox 360</a>
                    </nav>
                </div>
            </div>
        </section>
    </main>

    <nav style="margin-left: 2rem;">
        <a class="btn" href="../index.html">Retour à l'acceuil</a>
    </nav>
    <div style="height: 10px;"></div>

    <footer>
        <p>© 2026 PixelVault</p>
    </footer>
</body>

</html>
