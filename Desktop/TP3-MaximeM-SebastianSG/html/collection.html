<!DOCTYPE html>
<html lang="fr">

<head>

<body>

            <a href="../index.html">
                <img src="../images/PixelVault logo 2.1.png" alt="Logo PixelVault" width="150px">

            <!--Barre de navigation-->
            <nav class="navigation">

                <div style="text-align: center;">
