<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Consoles - PixelVault</title>
    <link rel="stylesheet" href="../css/commun.css">
</head>

<body>

    <h1>Gestion des consoles</h1>

    <a href="../index.html">Retour accueil</a>

    <form id="formConsole">
        <input type="number" id="id_console" placeholder="ID console" required>
        <input type="text" id="nom_console" placeholder="Nom console" required>
        <input type="date" id="date_sortie" placeholder="Date sortie">
        <input type="number" id="id_fabricant" placeholder="ID fabricant" required>

        <button type="submit">Ajouter</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Date sortie</th>
                <th>ID fabricant</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tableConsoles"></tbody>
    </table>

    <script src="../js/api.js"></script>
    <script src="../js/consoles.js"></script>

</body>

</html>
