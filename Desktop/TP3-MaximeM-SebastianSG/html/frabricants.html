<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Fabricants - PixelVault</title>
    <link rel="stylesheet" href="../css/commun.css">
</head>

<body>

    <h1>Gestion des fabricants</h1>

    <a href="../index.html">Retour accueil</a>

    <form id="formFabricant">

        <input type="number"
               id="id_fabricant"
               placeholder="ID fabricant"
               required>

        <input type="text"
               id="nom_fabricant"
               placeholder="Nom fabricant"
               required>

        <input type="text"
               id="pays_origine"
               placeholder="Pays origine">

        <button type="submit">
            Ajouter
        </button>

    </form>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Pays</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tableFabricants"></tbody>

    </table>

    <script src="../js/api.js"></script>
    <script src="../js/fabricants.js"></script>

</body>

</html>
