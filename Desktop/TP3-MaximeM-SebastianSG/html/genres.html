<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Genres - PixelVault</title>
    <link rel="stylesheet" href="../css/commun.css">
</head>

<body>

    <h1>Gestion des genres</h1>

    <a href="../index.html">Retour accueil</a>

    <form id="formGenre">

        <input type="number"
               id="id_genre"
               placeholder="ID genre"
               required>

        <input type="text"
               id="nom_genre"
               placeholder="Nom genre"
               required>

        <button type="submit">
            Ajouter
        </button>

    </form>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tableGenres"></tbody>

    </table>

    <script src="../js/api.js"></script>
    <script src="../js/genres.js"></script>

</body>

</html>
