<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault - Exemplaire</title>
    <link rel="stylesheet" href="../css/commun.css" />
</head>

<body>
    <!--Header-->
    <header>
        <div class="header-container">
            <a href="./index.html">
                <img src="../images/PixelVault logo 2.1.png" alt="Logo PixelVault" width="150px">
            </a>
            <!--Barre de navigation-->
            <nav class="navigation">
                <div class="rectangle2" style="margin-right: 15px;"><a href="./index.html">Acceuil</a></div>
                <div class="rectangle1"><a href="./collection.html">Collection</a></div>
            </nav>
        </div>
    </header>

    <!--Détails du jeu sélectionné-->
    <main class="contenu_main">
        <h1 class="h_1">Collection - Exemplaire</h1>
        <section>
            <h3>Détails du jeu</h3>
            <div class="exemplaire">
                <p style="margin-right: 20px;">
                    Jeu : <span id="info-titre"></span><br>
                    Console : <span id="info-console"></span><br>
                    Genre : <span id="info-genre"></span><br>
                    Année de sortie : <span id="info-annee-sortie"></span><br>
                    Stock : <span id="info-stock"></span><br>
                    Prix : <span id="info-prix"></span> $
                </p>

                <a id="btn-acheter" class="btn">Acheter</a>
                <a id="btn-vendre" class="btn">Vendre</a>
            </div>
        </section>
    </main>

    <!-- Le bouton "Page précédente" pointe vers collection-jeux.html avec le bon fabricant -->
    <nav style="margin-left: 2rem;" id="nav-retour">
        <!-- Rempli dynamiquement par le script ci-dessous -->
    </nav>

    <footer>
        <p>© 2026 PixelVault</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/exemplaire.js"></script>
    <script>
        // Construit le lien "Page précédente" en réutilisant le paramètre "fabricant"
        const params = new URLSearchParams(window.location.search);
        const fabricant = params.get('fabricant');

        const navRetour = document.getElementById('nav-retour');
        const lienRetour = document.createElement('a');
        lienRetour.classList.add('btn');
        lienRetour.textContent = 'Page précédente';

        if (fabricant) {
            lienRetour.href = `./collection-jeux.html?fabricant=${encodeURIComponent(fabricant)}`;
        } else {
            lienRetour.href = './collection.html';
        }

        navRetour.appendChild(lienRetour);
    </script>
</body>

</html>
