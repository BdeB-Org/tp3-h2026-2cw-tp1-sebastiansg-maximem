<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault - Jeux</title>
    <link rel="icon" type="image/png" href="../images/PixelVault logo (icone).png">
    <link rel="stylesheet" href="../css/commun.css" />
</head>

<body>
    <!--Header-->
    <header>
        <div class="header-container">
            <a href="./index.html">
                <img src="../images/PixelVault logo 2.1.png" alt="Logo PixelVault" width="150px">
            </a>
            <!--Barre de navigation-->
            <nav class="navigation">
                <div class="rectangle2" style="margin-right: 15px;"><a href="./index.html">Acceuil</a></div>
                <div class="rectangle1"><a href="./collection.html">Collection</a></div>
            </nav>
        </div>
    </header>

    <!--Liste des jeux du fabricant sélectionné-->
    <main class="contenu_main">
        <!-- Le titre est mis à jour dynamiquement par collection.js -->
        <h1 class="h_1" id="titre-fabricant">Collection - Jeux</h1>
        <section>
            <h3>Choisissez le jeu de votre choix</h3>
            <!-- Disposition côte à côte : liste à gauche, formulaire à droite -->
            <div class="layout-liste-formulaire">
                <div id="jeux-container"></div>

                <!-- Formulaire d'ajout d'un jeu -->
                <div class="formulaire-ajout">
                    <h4>Ajouter un jeu</h4>

                    <label for="input-titre-jeu">Titre du jeu</label>
                    <input type="text" id="input-titre-jeu" placeholder="ex. Super Mario Bros" />

                    <label for="input-annee-jeu">Année d'édition</label>
                    <input type="number" id="input-annee-jeu" placeholder="ex. 1996" min="1970" max="2026" />

                    <label for="select-console-jeu">Console</label>
                    <select id="select-console-jeu">
                        <option value="">-- Choisir une console --</option>
                    </select>

                    <label for="select-genre-jeu">Genre</label>
                    <select id="select-genre-jeu">
                        <option value="">-- Choisir un genre --</option>
                    </select>

                    <label for="input-stock-jeu">Stock initial</label>
                    <input type="number" id="input-stock-jeu" placeholder="ex. 5" min="0" />

                    <label for="input-prix-jeu">Prix d'achat ($)</label>
                    <input type="number" id="input-prix-jeu" placeholder="ex. 29.99" min="0" step="0.01" />

                    <button class="btn" id="btn-ajouter-jeu">Ajouter</button>

                    <p id="message-jeu" class="message-retour"></p>
                </div>
            </div>
        </section>
    </main>

    <nav style="margin-left: 2rem;">
        <a class="btn" href="./collection.html">Page précédente</a>
    </nav>

    <footer>
        <p>© 2026 PixelVault</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/collection.js"></script>
    <script>
        // Lit le paramètre "fabricant" depuis l'URL et charge les jeux correspondants
        const fabricant = new URLSearchParams(window.location.search).get('fabricant');

        if (fabricant) {
            afficherCollection(fabricant);
            chargerFormulairJeux(fabricant); // Prépare les listes déroulantes du formulaire
        } else {
            document.getElementById('jeux-container').innerHTML = '<p>Aucun fabricant spécifié.</p>';
        }
    </script>
</body>

</html>
