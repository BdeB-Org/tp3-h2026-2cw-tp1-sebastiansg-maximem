<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault - Jeux</title>
    <link rel="stylesheet" href="../css/commun.css" />
</head>

<body>
    <!--Header-->
    <header>
        <div class="header-container">
            <a href="./index.html">
                <img src="../images/PixelVault logo 2.1.png" alt="Logo PixelVault" width="150px">
            </a>
            <!--Barre de navigation-->
            <nav class="navigation">
                <div class="rectangle2" style="margin-right: 15px;"><a href="./index.html">Acceuil</a></div>
                <div class="rectangle1"><a href="./collection.html">Collection</a></div>
            </nav>
        </div>
    </header>

    <!--Liste des jeux du fabricant sélectionné-->
    <main class="contenu_main">
        <!-- Le titre est mis à jour dynamiquement par collection.js -->
        <h1 class="h_1" id="titre-fabricant">Collection - Jeux</h1>
        <section>
            <h3>Choisissez le jeu de votre choix</h3>
            <div id="conteneur-jeux"></div>
        </section>
    </main>

    <nav style="margin-left: 2rem;">
        <a class="btn" href="./collection.html">Page précédente</a>
    </nav>

    <footer>
        <p>© 2026 PixelVault</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/collection.js"></script>
    <script>
        // Lit le paramètre "fabricant" depuis l'URL et charge les jeux correspondants
        const fabricant = new URLSearchParams(window.location.search).get('fabricant');

        if (fabricant) {
            afficherCollection(fabricant);
        } else {
            document.getElementById('conteneur-jeux').innerHTML = '<p>Aucun fabricant spécifié.</p>';
        }
    </script>
</body>

</html>
