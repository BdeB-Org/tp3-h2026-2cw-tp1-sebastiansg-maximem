<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelVault - Collection</title>
    <link rel="icon" type="image/png" href="../images/PixelVault logo (icone).png" />
    <link rel="stylesheet" href="../css/commun.css" />
</head>

<body>
    <!--Header-->
    <header>
        <div class="header-container">
            <a href="./index.html">
                <img src="../images/PixelVault logo 2.1.png" alt="Logo PixelVault" width="150px" />
            </a>
            <!--Barre de navigation-->
            <nav class="navigation">
                <div class="rectangle2" style="margin-right: 15px">
                    <a href="./index.html">Acceuil</a>
                </div>
                <div class="rectangle1"><a href="#">Collection</a></div>
            </nav>
        </div>
    </header>

    <main class="contenu_main">
        <h1 class="h_1">Collection - Fabricant</h1>
        <h3>Choisissez votre fabricant</h3>
        <!-- Disposition côte à côte : liste à gauche, formulaire à droite -->
        <div class="layout-liste-formulaire">
            <div id="fabricants-container"></div>

            <!-- Formulaire d'ajout d'un fabricant -->
            <div class="formulaire-ajout">
                <h4>Ajouter un fabricant</h4>

                <label for="input-nom-fabricant">Nom du fabricant</label>
                <input type="text" id="input-nom-fabricant" placeholder="ex. Microsoft" />

                <button class="btn" id="btn-ajouter-fabricant">Ajouter</button>

                <p id="message-fabricant" class="message-retour"></p>
            </div>
        </div>
    </main>

    <nav style="margin-left: 2rem;">
        <a class="btn" href="./index.html">Retour à l'acceuil</a>
    </nav>

    <footer>
        <p>© 2026 PixelVault</p>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/collection.js"></script>
</body>

</html>
